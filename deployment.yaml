apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
      - name: bonos-service
        image: 605493908341.dkr.ecr.us-east-1.amazonaws.com/bonos-service:latest
        ports:
        - containerPort: 8004
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        
---
apiVersion: v1
kind: Service
metadata:
  name: bonos-service
spec:
  type: ClusterIP 
  selector:
    app: bonos-service
  ports:
  - port: 8004
    targetPort: 8004