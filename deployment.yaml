apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
      - name: bonos-service
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/bonos-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        envFrom:
        - secretRef:
            name: casino-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bonos-service
spec:
  type: ClusterIP 
  selector:
    app: bonos-service
  ports:
  - port: 8004
    targetPort: 8004